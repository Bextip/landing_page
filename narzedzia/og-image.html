<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Bextip – obraz do podglądu linków</title>
<!-- Szablon assets/og-image.png (1200×630). Generowanie: narzedzia/og-image.ps1 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Lexend:wght@800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #fff; font-family: Inter, sans-serif;
    background: radial-gradient(circle at 88% 12%, #2B64B2 0, #1C4F95 58%); }
  .copy { position: absolute; left: 64px; top: 56px; width: 560px; }
  .logo { display: block; width: auto; height: 84px; margin-bottom: 44px; }
  h1 { font-family: Lexend, sans-serif; font-weight: 800; font-size: 54px; line-height: 1.12; letter-spacing: -0.02em; }
  ul { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  li { background: #86C93E; color: #0C2A55; font-weight: 600; font-size: 20px; padding: 8px 16px; border-radius: 999px; }
  .url { position: absolute; left: 64px; bottom: 42px; font-size: 22px; font-weight: 500; color: #C9D8EE; }
  /* ekran w oknie przegladarki, jak na stronie (.window w styles.css) */
  .shot { position: absolute; left: 650px; top: 100px; width: 640px; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 30px 70px -10px rgba(5, 20, 45, .6), 0 40px 110px -30px rgba(31, 134, 207, .6); }
  .bar { height: 34px; display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; padding: 0 14px;
    background: #E8EDF4; border-bottom: 1px solid #D8E0EC; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; box-shadow: 18px 0 #febc2e, 36px 0 #28c840; }
  .bar span { justify-self: center; width: 300px; height: 22px; border-radius: 6px; background: #fff;
    font-size: 12px; font-weight: 500; line-height: 22px; color: #55627D; text-align: center; }
  .shot img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="copy">
    <img class="logo" src="../assets/logo/Bextip-Stadion-logotyp-zlota-kropka.svg" alt="">
    <h1>Firmowy typer piłkarski, który integruje zespół</h1>
    <ul>
      <li>Liga Mistrzów i wielkie turnieje</li>
      <li>Logo i kolory Twojej firmy</li>
    </ul>
  </div>
  <div class="url">bextip.site</div>
  <div class="shot"><div class="bar"><i></i><span>bextip.com/predictions</span></div><img src="../assets/screens/typowania.svg" alt=""></div>
</body>
</html>
