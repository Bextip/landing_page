<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Bextip – ikony Uicons do SVG</title>
<!-- Zamienia wybrane ikony Uicons (Flaticon, zestaw regular rounded – ten sam co na eqrento.com) na ścieżki SVG 24×24.
     Uruchamiane przez narzedzia/uicons.ps1, który zapisuje je jako assets/icons/<plik>.svg.
     Licencja Uicons: darmowa z podpisem „Uicons by Flaticon” i linkiem w stopce strony – zostaw go, póki strona ich używa. -->
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
</head>
<body>
<pre id="out"></pre>
<script>
  // plik w assets/icons/  →  nazwa ikony w Uicons (jak na flaticon.com/uicons)
  var ICONS = {
    "who-firmy": "fi-rr-shop",      // Właściciele małych i średnich firm
    "who-hr": "fi-rr-users",        // Działy HR
    "who-liderzy": "fi-rr-trophy"   // Menedżerowie i liderzy zespołów
  };
  var FONT = "https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/uicons-regular-rounded-KDJ23353.woff";
  fetch(FONT).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
    var font = opentype.parse(buf), byName = {}, lines = [];
    for (var i = 0; i < font.glyphs.length; i++) { var g = font.glyphs.get(i); if (g.name) byName[g.name] = g; }
    Object.keys(ICONS).forEach(function (file) {
      var g = byName[ICONS[file]];
      // siatka ikon to 24 × 24 (unitsPerEm = ascender), linia bazowa na dole: y = 24
      lines.push(file + "|" + (g ? g.getPath(0, font.ascender * 24 / font.unitsPerEm, 24).toPathData(2) : "BRAK " + ICONS[file]));
    });
    document.getElementById("out").textContent = lines.join("\n");
  });
</script>
</body>
</html>
