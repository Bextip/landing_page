<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bextip – firmowy typer piłkarski, który integruje zespół</title>
  <meta name="description" content="Bextip to automatyczny typer on-line dla firm. Pracownicy typują wyniki meczów Ligi Mistrzów i wielkich turniejów piłkarskich, a wyniki, punkty i tabela liczą się same. Z logo i kolorami Twojej firmy, bez instalacji." data-i18n-attr="content:meta.description">
  <link rel="canonical" href="https://bextip.site/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bextip">
  <meta property="og:locale" content="pl_PL">
  <meta property="og:url" content="https://bextip.site/">
  <meta property="og:title" content="Bextip – firmowy typer piłkarski, który integruje zespół">
  <meta property="og:description" content="Automatyczny typer on-line dla firm: Liga Mistrzów i wielkie turnieje piłkarskie. Logo i kolory Twojej firmy, bez instalacji, start w kilka godzin.">
  <meta property="og:image" content="https://bextip.site/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Bextip – firmowy typer piłkarski, który integruje zespół">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1C4F95">
  <link rel="icon" href="assets/logo/Bextip-Stadion-logo-sygnet-ikona.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261110f">
</head>
<body>

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="#top" aria-label="Bextip">
      <img src="assets/logo/Bextip-Stadion-logotyp-na-jasnym-tle-zlota-kropka.svg" alt="Bextip" width="123" height="36">
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#pricing" data-i18n="nav.pricing"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="nav__right">
      <!-- wybór języka: rozwijana lista z flagami; pozycje buduje script.js z listy languages w config.js -->
      <div class="lang" id="lang">
        <button type="button" class="lang__btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-controls="langList">
          <img class="lang__flag" id="langFlag" src="assets/flags/pl.svg" alt="" width="20" height="14">
          <span class="lang__name" id="langName">Polski</span>
          <svg class="lang__chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="lang__list" id="langList" hidden></ul>
      </div>
      <a class="btn btn--ghost nav__login" data-href="app" data-i18n="nav.login"></a>
      <a class="btn btn--primary" href="#pricing" data-i18n="nav.cta"></a>
      <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="wrap hero__in">
      <div class="hero__copy">
        <span class="pill" data-i18n="hero.badge"></span>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <ul class="chips">
          <li data-i18n="hero.chip1"></li>
          <li data-i18n="hero.chip2"></li>
          <li data-i18n="hero.chip3"></li>
          <li data-i18n="hero.chip4"></li>
        </ul>
        <div class="hero__cta">
          <a class="btn btn--primary btn--lg" href="#pricing" data-i18n="hero.cta"></a>
          <a class="btn btn--ghost btn--lg" href="#how" data-i18n="hero.cta2"></a>
        </div>
      </div>
      <div class="hero__shot">
        <div class="window">
          <div class="window__bar" aria-hidden="true"><i class="window__dots"></i><span class="window__url">bextip.com/predictions</span></div>
          <img src="assets/screens/typowania.svg" width="1080" height="720" alt="" data-i18n-attr="alt:hero.shotAlt">
        </div>
      </div>
    </div>
  </section>

  <section class="section section--tint" id="about">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="about.title"></h2>
        <p class="sub" data-i18n="about.sub"></p>
      </div>
      <div class="compare">
        <article class="card">
          <h3 data-i18n="about.a.title"></h3>
          <p class="quote" data-i18n="about.a.quote"></p>
          <ul class="list list--minus" data-i18n-list="about.a.items"></ul>
        </article>
        <article class="card card--hl">
          <span class="tag" data-i18n="about.b.tag"></span>
          <h3>Bextip</h3>
          <p class="quote" data-i18n="about.b.quote"></p>
          <ul class="list list--check" data-i18n-list="about.b.items"></ul>
          <a class="btn btn--primary" href="#pricing" data-i18n="hero.cta"></a>
        </article>
        <article class="card">
          <h3 data-i18n="about.c.title"></h3>
          <p class="quote" data-i18n="about.c.quote"></p>
          <ul class="list list--minus" data-i18n-list="about.c.items"></ul>
        </article>
      </div>
    </div>
  </section>

  <section class="section" id="features">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="features.title"></h2>
        <p class="sub" data-i18n="features.sub"></p>
      </div>
      <div class="grid3" id="featureGrid"></div>
    </div>
  </section>

  <section class="section section--tint" id="inside">
    <div class="wrap inside">
      <div>
        <h2 data-i18n="inside.title"></h2>
        <p class="sub" data-i18n="inside.sub"></p>
        <ul class="list list--check" data-i18n-list="inside.items"></ul>
      </div>
      <div class="window">
        <div class="window__bar" aria-hidden="true"><i class="window__dots"></i><span class="window__url">bextip.com/tips-stats</span></div>
        <img src="assets/screens/tips-stats.svg" width="1080" height="720" loading="lazy" alt="" data-i18n-attr="alt:inside.shotAlt">
      </div>
    </div>
  </section>

  <section class="section" id="how">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="how.title"></h2>
        <p class="sub" data-i18n="how.sub"></p>
      </div>
      <ol class="steps" id="stepList"></ol>
    </div>
  </section>

  <section class="section section--blue" id="who">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="who.title"></h2>
      </div>
      <div class="grid3" id="whoGrid"></div>
    </div>
  </section>

  <section class="section section--tint" id="pricing">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="pricing.title"></h2>
        <p class="sub" data-i18n="pricing.sub"></p>
      </div>
      <div id="planGrid"></div>
      <div class="card included">
        <h3 data-i18n="pricing.includedTitle"></h3>
        <ul class="list list--check" id="includedList"></ul>
      </div>
      <p class="note" data-i18n="pricing.note"></p>
    </div>
  </section>

  <section class="section" id="faq">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="faq.title"></h2>
      </div>
      <div id="faqList"></div>
    </div>
  </section>

  <section class="section cta" id="contact">
    <div class="wrap wrap--narrow">
      <h2 data-i18n="cta.title"></h2>
      <p class="sub" data-i18n="cta.sub"></p>
      <div class="hero__cta hero__cta--center">
        <a class="btn btn--white btn--lg" href="#pricing" data-i18n="hero.cta"></a>
        <a class="btn btn--outline btn--lg" data-href="mail" data-i18n="cta.contact"></a>
      </div>
      <p class="cta__tel"><a data-href="tel"></a> · <a data-href="mail">kontakt@bextip.com</a></p>
    </div>
  </section>

</main>

<!-- Stopka wg schematu eqrento.com: marka, Kontakt, Serwis, Aplikacja; hasło; prawa autorskie i linki prawne -->
<footer class="footer">
  <div class="wrap">
    <div class="footer__grid">
      <div class="footer__brand">
        <a href="#top" aria-label="Bextip"><img src="assets/logo/Bextip-Stadion-logotyp-zlota-kropka.svg" alt="Bextip" width="150" height="44"></a>
        <p data-i18n="footer.about"></p>
        <p data-i18n="footer.invite"></p>
      </div>
      <div class="footer__col">
        <h3 data-i18n="footer.contactTitle"></h3>
        <ul>
          <li><a data-href="mail">kontakt@bextip.com</a></li>
          <li><a data-href="tel"></a></li>
        </ul>
      </div>
      <div class="footer__col">
        <h3 data-i18n="footer.siteTitle"></h3>
        <ul>
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#features" data-i18n="nav.features"></a></li>
          <li><a href="#how" data-i18n="nav.how"></a></li>
          <li><a href="#pricing" data-i18n="nav.pricing"></a></li>
          <li><a href="#faq" data-i18n="nav.faq"></a></li>
        </ul>
      </div>
      <div class="footer__col">
        <h3 data-i18n="footer.appTitle"></h3>
        <ul>
          <li><a data-href="app" data-i18n="footer.login"></a></li>
          <li><a data-href="register" data-i18n="footer.register"></a></li>
        </ul>
      </div>
    </div>
    <!-- flaga jako SVG, nie emoji: Windows pokazuje emoji flagi jako litery "PL" -->
    <p class="footer__tagline"><span data-i18n="footer.tagline1"></span> <span class="nowrap"><svg width="14" height="9" viewBox="0 0 16 10" aria-hidden="true" focusable="false"><path d="M1.5 0h13A1.5 1.5 0 0 1 16 1.5V5H0V1.5A1.5 1.5 0 0 1 1.5 0z" fill="#fff"/><path d="M0 5h16v3.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 8.5z" fill="#dc143c"/></svg>&nbsp;<span data-i18n="footer.tagline2"></span></span></p>
    <div class="footer__bottom">
      <p>Copyright © <span id="year"></span> Bextip. <span data-i18n="footer.rights"></span></p>
      <ul class="footer__legal">
        <li><a href="#" data-i18n="footer.terms"></a></li>
        <li><a href="#" data-i18n="footer.privacy"></a></li>
      </ul>
    </div>
  </div>
</footer>

<script src="config.js?v=20261110f"></script>
<script src="i18n.js?v=20261110f"></script>
<script src="script.js?v=20261110f"></script>
</body>
</html>
