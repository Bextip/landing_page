  <script>
    /* Przeglądarka i system odwiedzającego (Łukasz, 11.11.2026) – od nich zależy okno wokół ekranów aplikacji:
       br-chrome / br-safari / br-edge / br-firefox / br-samsung (5 najpopularniejszych w Europie i USA, StatCounter,
       10.2026) → okno tej przeglądarki (frames.js), br-other → uniwersalne okno Windows (styles.css);
       os-apple / os-other → kropki macOS albo przyciski Windows w oknach Chrome, Edge i Firefox.
       Ustawiane tutaj, w <head>, zanim strona się narysuje, żeby okno nie zmieniało wyglądu w trakcie. */
    (function (d, n) {
      var ua = n.userAgent || "";
      var p = (n.userAgentData && n.userAgentData.platform) || n.platform || "";
      var apple = /mac|iphone|ipad|ipod/i.test(p) || /Macintosh|iPhone|iPad|iPod/.test(ua);
      var br = /SamsungBrowser\//.test(ua) ? "samsung"
        : /Edg(e|A|iOS)?\//.test(ua) ? "edge"
        : /OPR\/|Opera|OPT\/|YaBrowser|Vivaldi|UCBrowser/.test(ua) ? "other"
        : /Firefox\/|FxiOS\//.test(ua) ? "firefox"
        : /Chrome\/|CriOS\//.test(ua) ? "chrome"
        : apple && /Version\/[\d.]+.*Safari\//.test(ua) ? "safari" : "other";
      // podgląd innego okna w adresie: ?okno=chrome-mac, ?okno=edge-win, ?okno=safari, ?okno=samsung, ?okno=other…
      var f = /[?&]okno=(chrome|safari|edge|firefox|samsung|other)(-mac|-win)?(?:&|$)/.exec(location.search);
      if (f) { br = f[1]; apple = f[2] ? f[2] === "-mac" : br === "safari"; }
      d.documentElement.className += (apple ? " os-apple" : " os-other") + " br-" + br;
    })(document, navigator);
  </script>
