# Podgląd strony na GitHub Pages – aktualizuje się przy każdym pushu do gałęzi main
# (tak samo jak w projekcie EQrento). Włączenie: Settings → Pages → Source: GitHub Actions.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # pliki robocze (podgląd lokalny, narzędzia, dokumentacja) nie są częścią strony
      - name: Leave the working files out of the site
        run: rm -rf .claude .github narzedzia README.md .gitignore
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
