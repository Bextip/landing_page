<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Właściciele małych i średnich firm: firma (sklep / biuro), włączony przełącznik („uruchamiasz raz”), piłka -->
  <ellipse cx="160" cy="158" rx="128" ry="8" fill="#0C2A55" opacity=".08"/>
  <!-- przełącznik: włączony raz, gra toczy się sama -->
  <rect x="22" y="112" width="44" height="24" rx="12" fill="#86C93E"/>
  <circle cx="54" cy="124" r="9" fill="#fff"/>
  <path d="M30 124h6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- budynek -->
  <path d="M186 22v32" stroke="#0C2A55" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M187 23l23 7-23 7z" fill="#86C93E"/>
  <rect x="64" y="52" width="134" height="16" rx="4" fill="#1C4F95"/>
  <rect x="72" y="66" width="118" height="90" rx="4" fill="#fff"/>
  <rect x="176" y="66" width="14" height="90" fill="#DCE6F3"/>
  <!-- markiza w paski -->
  <g>
    <rect x="72" y="66" width="19.7" height="14" fill="#86C93E"/><circle cx="81.8" cy="80" r="9.8" fill="#86C93E"/>
    <rect x="91.7" y="66" width="19.7" height="14" fill="#fff"/><circle cx="101.5" cy="80" r="9.8" fill="#fff"/>
    <rect x="111.3" y="66" width="19.7" height="14" fill="#86C93E"/><circle cx="121.2" cy="80" r="9.8" fill="#86C93E"/>
    <rect x="131" y="66" width="19.7" height="14" fill="#fff"/><circle cx="140.8" cy="80" r="9.8" fill="#fff"/>
    <rect x="150.7" y="66" width="19.7" height="14" fill="#86C93E"/><circle cx="160.5" cy="80" r="9.8" fill="#86C93E"/>
    <rect x="170.3" y="66" width="19.7" height="14" fill="#fff"/><circle cx="180.2" cy="80" r="9.8" fill="#fff"/>
  </g>
  <path d="M72 66h118" stroke="#C9D8EE" stroke-width="1.5"/>
  <rect x="84" y="100" width="30" height="26" rx="3" fill="#C9D8EE"/>
  <path d="M99 100v26M84 113h30" stroke="#fff" stroke-width="2"/>
  <rect x="148" y="100" width="30" height="26" rx="3" fill="#C9D8EE"/>
  <path d="M163 100v26M148 113h30" stroke="#fff" stroke-width="2"/>
  <rect x="121" y="104" width="20" height="52" rx="2" fill="#1C4F95"/>
  <circle cx="136" cy="131" r="1.8" fill="#F5B82E"/>
  <!-- piłka -->
  <ellipse cx="240" cy="156" rx="22" ry="4" fill="#0C2A55" opacity=".14"/>
  <defs>
    <clipPath id="ball"><circle cx="240" cy="126" r="26"/></clipPath>
    <!-- łata na obwodzie (u góry, wierzchołkiem do środka) i szew do łaty środkowej; pozostałe cztery to obroty o 72° -->
    <g id="patch">
      <path d="M240 108l-8.56-6.22 3.27-10.06h10.58l3.27 10.06z" fill="#0C2A55"/>
      <path d="M240 117v-9" stroke="#0C2A55" stroke-width="2.2"/>
    </g>
  </defs>
  <circle cx="240" cy="126" r="26" fill="#fff"/>
  <g clip-path="url(#ball)">
    <use href="#patch"/>
    <use href="#patch" transform="rotate(72 240 126)"/>
    <use href="#patch" transform="rotate(144 240 126)"/>
    <use href="#patch" transform="rotate(216 240 126)"/>
    <use href="#patch" transform="rotate(288 240 126)"/>
  </g>
  <path d="M240 117l8.56 6.22-3.27 10.06h-10.58l-3.27-10.06z" fill="#0C2A55"/>
  <circle cx="240" cy="126" r="26" fill="none" stroke="#0C2A55" stroke-width="2.5"/>
  <!-- iskierki -->
  <path d="M280 78q1.6 7 8.6 8.6-7 1.6-8.6 8.6-1.6-7-8.6-8.6 7-1.6 8.6-8.6z" fill="#F5B82E"/>
  <path d="M214 84q1 4.4 5.4 5.4-4.4 1-5.4 5.4-1-4.4-5.4-5.4 4.4-1 5.4-5.4z" fill="#F5B82E"/>
</svg>
